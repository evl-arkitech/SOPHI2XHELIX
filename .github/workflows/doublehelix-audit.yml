name: Double Helix Autonomous Codebase Invariant Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  doublehelix-sre-audit:
    name: Invariant Verification & Ruin Prevention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Double Helix Neural Agent Engine & Dev Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Execute Full Pytest Test Suite (99 Invariant Tests)
        run: |
          python -m pytest tests/ -v

      - name: Run Double Helix Invariant Audit
        run: |
          doublehelix audit-repo . --output-md pr_audit_report.md

      - name: Run Mathematical Proof of Concept Suite
        run: |
          doublehelix prove

      - name: Setup Node.js for Cloudflare Edge Worker
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "cloudflare-edge/package-lock.json"

      - name: Verify Cloudflare Edge Worker TypeScript Compilation
        run: |
          cd cloudflare-edge
          npm ci
          npx tsc --noEmit

      - name: Comment PR Audit Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_audit_report.md')) {
              const body = fs.readFileSync('pr_audit_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
