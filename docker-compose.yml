version: '3.8'

services:
  # Container 1: Model Engine (Cognitive Specialization)
  model-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.model_engine
    container_name: doublehelix-model-engine
    ports:
      - "8001:8001"
      - "8002:8002"
    environment:
      - UPSTREAM_LLM_URL=${UPSTREAM_LLM_URL:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Container 3: High-Performance Shared Engine Runtime
  shared-runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.game_runtime
    container_name: doublehelix-shared-runtime
    ports:
      - "5000:5000"
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - RUNTIME_PORT=5000
      - RUNTIME_WORK_DIR=/tmp/game_sim
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Container 2: Agent Orchestration (Helix Synchronizer + 6 Agents)
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: doublehelix-orchestrator
    ports:
      - "8000:8000"
    ipc: host
    depends_on:
      model-engine:
        condition: service_healthy
      shared-runtime:
        condition: service_healthy
    environment:
      - REASONING_LLM_URL=http://model-engine:8001/v1
      - CODING_LLM_URL=http://model-engine:8002/v1
      - RUNTIME_API_URL=http://shared-runtime:5000
      - MAX_CYCLES_PER_TIER=5
    restart: on-failure
