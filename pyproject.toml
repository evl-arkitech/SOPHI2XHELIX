[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doublehelix-neural-agent"
version = "0.1.0"
description = "DoubleHelix Neural Agent Engine: Dual-Strand Synthesis & Empirical Verification Game Engine Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Cosmic Souls of Sovereignty Inc. / New-World-Arkitech.DEV" }
]
keywords = [
    "game-engine",
    "agentic-ai",
    "dual-strand",
    "ecs",
    "simulation",
    "parity-gates",
    "profiling",
    "llm-orchestration"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
doublehelix = "doublehelix.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
